[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "example-package-sergey"
dynamic = ["version"]
dependencies = ["numpy"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.version]
path = "src/example_package_sergey/__init__.py"
